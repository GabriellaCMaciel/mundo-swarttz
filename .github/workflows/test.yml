# Roda os testes sozinho a cada envio (push) e a cada pull request, para pegar erro antes de ele chegar ao site publicado.
# Para ver o resultado: aba Actions > "Testes". Bolinha verde = tudo certo; vermelha = algo quebrou (clique para ler o motivo).
# São dois grupos de testes (veja o README, seção "Testes"):
#   1. verificações rápidas (tests/checks.js): versões iguais em todo lugar, arquivos existem, simples.html em dia com o config.js;
#   2. testes de navegador (tests/mundo.spec.js): abrem o site de verdade num Chromium e usam a 1ª pessoa, os painéis, o tour etc.
name: Testes

on:
  push:
    branches: [main]
    paths-ignore: ['data/activity.json']   # o robô da atividade só atualiza esse arquivo; não precisa testar de novo
  pull_request:
  workflow_dispatch:                       # também dá para rodar na mão: Actions > Testes > Run workflow

permissions:
  contents: read

jobs:
  testar:
    # Ubuntu fixo (e não "ubuntu-latest"): quando o GitHub troca a versão do "latest", o navegador de teste (Playwright) pode ainda não ter suporte e tudo falha.
    # Para atualizar: subir o @playwright/test no package.json e depois trocar a versão aqui.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2          # o pai do commit: serve para ver quais arquivos o PR mudou
      # Trava do lançamento automático: PR que mexe no site precisa contar o que mudou no CHANGELOG.md (embaixo de "## [Não lançado]").
      # É esse texto que faz a versão subir sozinha depois que o PR é aceito (veja release.yml). Sem ele, a mudança iria ao ar sem versão nova
      # e o ?v= não mudaria, então quem já visitou o site poderia continuar vendo os arquivos antigos guardados no navegador.
      - name: PR que muda o site tem anotação no CHANGELOG
        if: github.event_name == 'pull_request'
        run: |
          MUDOU=$(git diff --name-only HEAD^1 HEAD)
          SITE=$(echo "$MUDOU" | grep -E '^(js/|css/|assets/|index\.html$|simples\.html$|404\.html$)' || true)
          if [ -n "$SITE" ] && ! echo "$MUDOU" | grep -qx 'CHANGELOG.md'; then
            echo "Este PR muda o site, mas não escreveu nada no CHANGELOG.md:"; echo "$SITE"
            echo "Escreva o que mudou embaixo de '## [Não lançado]' (Adicionado, Alterado, Corrigido ou Desempenho)."
            exit 1
          fi
          echo "ok"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Verificações rápidas
        run: npm run test:rapido
      - name: Instalar o Chromium do Playwright
        run: npx playwright install --with-deps chromium
      - name: Testes de navegador
        run: npx playwright test
      - name: Guardar o relatório se algo falhar
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-playwright
          path: |
            playwright-report/
            test-results/
          retention-days: 7
