# Roda os testes sozinho a cada envio (push) e a cada pull request, para pegar erro antes de ele chegar ao site publicado.
# Para ver o resultado: aba Actions > "Testes". Bolinha verde = tudo certo; vermelha = algo quebrou (clique para ler o motivo).
# São dois grupos de testes (veja o README, seção "Testes"):
#   1. verificações rápidas (tests/checks.js): versões iguais em todo lugar, arquivos existem, simples.html em dia com o config.js;
#   2. testes de navegador (tests/mundo.spec.js): abrem o site de verdade num Chromium e usam a 1ª pessoa, os painéis, o tour etc.
name: Testes

on:
  push:
    branches: [main]
    paths-ignore: ['data/activity.json']   # o robô da atividade só atualiza esse arquivo; não precisa testar de novo
  pull_request:
  workflow_dispatch:                       # também dá para rodar na mão: Actions > Testes > Run workflow

permissions:
  contents: read

jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Verificações rápidas
        run: npm run test:rapido
      - name: Instalar o Chromium do Playwright
        run: npx playwright install --with-deps chromium
      - name: Testes de navegador
        run: npx playwright test
      - name: Guardar o relatório se algo falhar
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-playwright
          path: |
            playwright-report/
            test-results/
          retention-days: 7
