<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Página não encontrada | Gabriella Swarttz</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0b0613">
  <meta name="color-scheme" content="dark">
  <!-- O GitHub Pages mostra este arquivo quando o endereço não existe. O endereço digitado pode ser fundo (ex.: /qualquer/coisa),
       então os links e o ícone usam endereço COMPLETO: um link relativo quebraria. Só fontes do sistema e CSS aqui dentro: nada para carregar. -->
  <link rel="icon" type="image/svg+xml" href="https://gabriellacmaciel.github.io/mundo-swarttz/assets/favicon.svg">
  <style>
    :root { --ink: #0b0613; --violet: #7b3fe4; --lilac: #b79af5; --gold: #f2b84b; --paper: #f6ecd9; }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0; display: grid; place-items: center; padding: 24px;
      background: radial-gradient(ellipse at 50% 0%, #2a1745 0%, var(--ink) 70%) fixed;
      color: var(--paper); font: 600 18px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main { width: min(520px, 100%); text-align: center; }
    .code { margin: 0; font: 800 clamp(72px, 22vw, 120px)/1 Georgia, "Times New Roman", serif; letter-spacing: .04em; color: var(--gold); }
    h1 { margin: 8px 0 12px; font-size: clamp(24px, 6vw, 32px); line-height: 1.2; }
    p { margin: 0 0 28px; color: #efe6ff; }
    .acts { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
    .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: .6em 1.4em; border-radius: 999px; border: 2px solid var(--gold); color: var(--paper); text-decoration: none; font-weight: 800; }
    .btn.primary { background: var(--gold); color: var(--ink); }
    .btn:hover { background: var(--gold); color: var(--ink); }
    .btn:focus-visible { outline: 3px solid var(--lilac); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <p class="code" aria-hidden="true">404</p>
    <h1>Essa página não existe por aqui</h1>
    <p>Talvez o endereço tenha mudado ou tenha sido digitado diferente. Você pode voltar ao portfólio em 3D ou ler a versão em texto.</p>
    <div class="acts">
      <a class="btn primary" href="https://gabriellacmaciel.github.io/mundo-swarttz/">Ir para o mundo 3D</a>
      <a class="btn" href="https://gabriellacmaciel.github.io/mundo-swarttz/simples.html">Ver a versão em texto</a>
    </div>
  </main>
</body>
</html>
