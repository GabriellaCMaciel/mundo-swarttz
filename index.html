<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Gabriella Swarttz | Portfólio</title>
  <meta name="description" content="Portfólio 3D interativo de Gabriella Swarttz: projetos, habilidades, formação, depoimentos e contatos.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@600;800&family=JetBrains+Mono:wght@400;700&family=Caveat:wght@500;700&display=swap">
  <link rel="stylesheet" href="css/style.css?v=20261016c">
</head>
<body>
<canvas id="stage" role="img" aria-label="Mundo 3D do portfólio de Gabriella Swarttz"></canvas>
<div class="hud">
  <div class="title" id="title"><b>Gabriella Swarttz</b><span>portfólio</span></div>
  <div class="brand" id="brand" hidden>Gabriella Swarttz</div>
  <button class="btn" id="skip" type="button">pular intro</button>
  <div class="card" id="card" hidden><h2 id="cardTitle"></h2><p id="cardText"></p><button class="btn" id="open" type="button">abrir (E)</button></div>
  <div class="hint" id="hint">toque ou aperte uma tecla para abrir o notebook</div>
  <div class="keys" id="keys" hidden>WASD ou setas para andar · E para abrir</div>
  <div class="joy" id="joy" hidden><div class="knob" id="knob"></div></div>
</div>
<div class="panel" id="panel" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></div></div>
<div class="flash" id="flash"></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<div class="mail" id="mail" hidden role="dialog" aria-modal="true" aria-labelledby="mailTitle">
  <div class="mail-petals" aria-hidden="true"></div>
  <button class="close mail-close" type="button" aria-label="Fechar">✕</button>
  <button class="close letter-back" id="letterBack" type="button" aria-label="Voltar às cartas" title="Voltar às cartas">✕</button>
  <header class="mail-head"><h2 id="mailTitle">CORREIOS</h2></header>
  <p class="mail-keys" id="mailKeys"></p>
  <div class="mail-stage" id="mailStage"></div>
  <button class="mail-nav prev" type="button" aria-label="Carta anterior">‹</button>
  <button class="mail-nav next" type="button" aria-label="Próxima carta">›</button>
  <footer class="mail-foot"><div class="mail-dots" id="mailDots"></div><p id="mailCount"></p><button class="btn" id="mailOpenBtn" type="button">abrir carta</button></footer>
  <div class="paper-wrap"><article class="paper-big" id="paperBig" hidden></article></div>
</div>

  <script src="js/kiara.js?v=20261016c"></script>
  <script src="js/mailbox.js?v=20261016c"></script>
  <script src="js/yardcats.js?v=20261016c"></script>
  <script src="js/phone.js?v=20261016c"></script>
  <script src="js/zones.js?v=20261016c"></script>
  <script src="js/decor.js?v=20261016c"></script>
  <script src="js/swing.js?v=20261016c"></script>
  <script src="js/playcats.js?v=20261016c"></script>
  <script src="js/mail.js?v=20261016c"></script>
  <script src="js/ui.js?v=20261016c"></script>

</body>
